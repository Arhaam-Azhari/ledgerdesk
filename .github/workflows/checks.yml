name: Accounting workflow checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledgerdesk
          POSTGRES_USER: ledgerdesk
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledgerdesk" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B test
        working-directory: backend
      - run: mvn -B test
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ledgerdesk
          TEST_DATABASE_USER: ledgerdesk
          TEST_DATABASE_PASSWORD: ci-only
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B package -DskipTests
        working-directory: backend
      - run: java -jar target/ledgerdesk-0.1.0.jar --spring.profiles.active=demo > backend.log 2>&1 &
        working-directory: backend
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npm run test:e2e && npm run test:reconciliation && npm run test:reports && npm run test:equity && npm run test:adjustments && npm run test:accruals
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            frontend/test-results/
            frontend/reconciliation-results/
            frontend/report-results/
            frontend/equity-results/
            frontend/adjustment-results/
            frontend/accrual-results/
