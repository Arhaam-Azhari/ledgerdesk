name: Accounting workflow checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.gitignore']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', '.gitignore']
  workflow_dispatch:
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      restore: ${{ steps.scope.outputs.restore }}
      browser: ${{ steps.scope.outputs.browser }}
      browser_checks: ${{ steps.scope.outputs.browser_checks }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - id: scope
        run: python3 scripts/ci_scope.py
  backend:
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledgerdesk
          POSTGRES_USER: ledgerdesk
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledgerdesk" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: mvn -B test
        working-directory: backend
      - run: mvn -B test
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ledgerdesk
          TEST_DATABASE_USER: ledgerdesk
          TEST_DATABASE_PASSWORD: ci-only
      - uses: actions/upload-artifact@v4
        with:
          name: statement-pdf-proof
          path: backend/target/statement-pdf-proof/
          if-no-files-found: error
  browser:
    needs: scope
    if: needs.scope.outputs.browser == 'true' || needs.scope.outputs.restore == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - if: needs.scope.outputs.browser == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B package -DskipTests
        working-directory: backend
      - if: needs.scope.outputs.restore == 'true'
        run: |
          python3 scripts/verify_year_end_restore.py --database h2
          python3 scripts/verify_opening_books_restore.py --database h2
      - if: needs.scope.outputs.browser == 'true'
        run: java -jar target/ledgerdesk-0.1.0.jar --spring.profiles.active=demo > backend.log 2>&1 &
        working-directory: backend
      - if: needs.scope.outputs.browser == 'true'
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          for check in $BROWSER_CHECKS; do
            npm run "$check" || exit 1
          done
        env:
          BROWSER_CHECKS: ${{ needs.scope.outputs.browser_checks }}
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            frontend/test-results/
            frontend/reconciliation-results/
            frontend/report-results/
            frontend/account-activity-results/
            frontend/year-end-results/
            frontend/year-end-control-results/
            frontend/opening-books-results/
            frontend/equity-results/
            frontend/adjustment-results/
            frontend/accrual-results/
            frontend/handoff-results/
            frontend/prepaid-results/
            frontend/asset-results/
            frontend/cash-results/
            frontend/reviewer-results/
            frontend/persistent-results/
            frontend/account-results/
            frontend/opening-results/
            frontend/period-results/
            frontend/bookkeeper-results/
            frontend/password-results/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: year-end-h2-restore-log
          path: |
            year-end-h2-restore.log
            opening-books-h2-restore.log

  postgres-restore:
    needs: scope
    if: needs.scope.outputs.restore == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ledgerdesk
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledgerdesk" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B package -DskipTests
        working-directory: backend
      - run: python3 scripts/verify_postgres_restore.py
        env:
          LEDGERDESK_PG_CONTAINER: ${{ job.services.postgres.id }}
          PGUSER: ledgerdesk
          DATABASE_PASSWORD: ci-only
      - run: |
          python3 scripts/verify_year_end_restore.py --database postgres
          python3 scripts/verify_opening_books_restore.py --database postgres
        env:
          LEDGERDESK_PG_CONTAINER: ${{ job.services.postgres.id }}
          PGUSER: ledgerdesk
          DATABASE_PASSWORD: ci-only
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: postgres-restore-log
          path: |
            postgres-restore-backend.log
            year-end-postgres-restore.log
            opening-books-postgres-restore.log
