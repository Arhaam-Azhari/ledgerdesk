name: Accounting workflow checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledgerdesk
          POSTGRES_USER: ledgerdesk
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledgerdesk" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: mvn -B test
        working-directory: backend
      - run: mvn -B test
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ledgerdesk
          TEST_DATABASE_USER: ledgerdesk
          TEST_DATABASE_PASSWORD: ci-only
      - uses: actions/upload-artifact@v4
        with:
          name: statement-pdf-proof
          path: backend/target/statement-pdf-proof/
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B package -DskipTests
        working-directory: backend
      - run: python3 scripts/verify_year_end_restore.py --database h2
      - run: java -jar target/ledgerdesk-0.1.0.jar --spring.profiles.active=demo > backend.log 2>&1 &
        working-directory: backend
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npm run test:e2e && npm run test:password && npm run test:bookkeeper && npm run test:periods && npm run test:reconciliation && npm run test:reports && npm run test:account-activity && npm run test:year-end && npm run test:year-end-controls && npm run test:opening-books && npm run test:equity && npm run test:adjustments && npm run test:accruals && npm run test:handoff && npm run test:prepaid && npm run test:assets && npm run test:cash && npm run test:reviewer && npm run test:persistent && npm run test:accounts && npm run test:opening
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            frontend/test-results/
            frontend/reconciliation-results/
            frontend/report-results/
            frontend/account-activity-results/
            frontend/year-end-results/
            frontend/year-end-control-results/
            frontend/opening-books-results/
            frontend/equity-results/
            frontend/adjustment-results/
            frontend/accrual-results/
            frontend/handoff-results/
            frontend/prepaid-results/
            frontend/asset-results/
            frontend/cash-results/
            frontend/reviewer-results/
            frontend/persistent-results/
            frontend/account-results/
            frontend/opening-results/
            frontend/period-results/
            frontend/bookkeeper-results/
            frontend/password-results/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: year-end-h2-restore-log
          path: year-end-h2-restore.log

  postgres-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ledgerdesk
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledgerdesk" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B package -DskipTests
        working-directory: backend
      - run: python3 scripts/verify_postgres_restore.py
        env:
          LEDGERDESK_PG_CONTAINER: ${{ job.services.postgres.id }}
          PGUSER: ledgerdesk
          DATABASE_PASSWORD: ci-only
      - run: python3 scripts/verify_year_end_restore.py --database postgres
        env:
          LEDGERDESK_PG_CONTAINER: ${{ job.services.postgres.id }}
          PGUSER: ledgerdesk
          DATABASE_PASSWORD: ci-only
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: postgres-restore-log
          path: |
            postgres-restore-backend.log
            year-end-postgres-restore.log
